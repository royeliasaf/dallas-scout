<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Roy's Dallas Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,800;0,9..144,900;1,9..144,300&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea;
    --bg-2: #ebe6db;
    --ink: #1a1814;
    --ink-soft: #4a463e;
    --rule: #d6cfbf;
    --accent: #c8341e;
    --accent-2: #1f4a2e;
    --gold: #b8893a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Fraunces', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle paper grain */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(184,137,58,0.03) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(31,74,46,0.025) 0%, transparent 50%);
    pointer-events: none;
    z-index: 1;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 32px 80px;
    position: relative;
    z-index: 2;
  }

  /* HEADER */
  header {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 20px;
    margin-bottom: 32px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
  }

  .masthead {
    flex: 1;
    min-width: 280px;
  }

  .meta-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-soft);
    display: flex;
    gap: 16px;
    align-items: center;
    margin-bottom: 12px;
  }

  .meta-line .dot {
    width: 4px; height: 4px; background: var(--accent); border-radius: 50%;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(48px, 8vw, 96px);
    line-height: 0.88;
    letter-spacing: -0.04em;
    font-variation-settings: "opsz" 144;
  }

  h1 .italic {
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
  }

  .subtitle {
    font-size: 16px;
    color: var(--ink-soft);
    font-style: italic;
    margin-top: 12px;
    max-width: 480px;
  }

  .stats {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-soft);
    line-height: 1.8;
    border-left: 1px solid var(--rule);
    padding-left: 20px;
  }

  .stats strong {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--ink);
    display: block;
    text-transform: none;
    letter-spacing: -0.02em;
  }

  /* CATEGORY NAV */
  .nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 40px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--rule);
  }

  .cat-btn {
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    padding: 10px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
  }

  .cat-btn:hover {
    background: var(--ink);
    color: var(--bg);
  }

  .cat-btn.active {
    background: var(--ink);
    color: var(--bg);
  }

  .cat-btn .count {
    background: var(--bg);
    color: var(--ink);
    border-radius: 99px;
    padding: 1px 8px;
    font-size: 10px;
    font-weight: 700;
  }

  .cat-btn.active .count {
    background: var(--accent);
    color: var(--bg);
  }

  /* SECTION HEADERS */
  .section {
    margin-bottom: 56px;
    animation: fadeIn 0.4s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 12px;
  }

  .section-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--accent);
    font-weight: 700;
  }

  .section-title {
    font-family: 'Fraunces', serif;
    font-size: 32px;
    font-weight: 600;
    font-style: italic;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  .section-desc {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-left: auto;
  }

  /* CARD GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
  }

  .card {
    background: var(--bg);
    padding: 24px;
    transition: background 0.2s;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    min-height: 200px;
  }

  .card:hover {
    background: var(--bg-2);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
    gap: 12px;
  }

  .card-name {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.015em;
  }

  .rating {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    white-space: nowrap;
    text-align: right;
  }

  .rating .num {
    color: var(--accent);
    font-weight: 700;
    font-size: 14px;
  }

  .tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: 3px 8px;
    border: 1px solid var(--rule);
  }

  .tag.price {
    color: var(--gold);
    border-color: var(--gold);
  }

  .note {
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink-soft);
    flex: 1;
  }

  .card-footer {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px dashed var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .address {
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    margin-right: 12px;
  }

  .open-link {
    color: var(--accent);
    font-weight: 700;
    white-space: nowrap;
  }

  .open-link::after {
    content: ' →';
  }

  .card:hover .open-link {
    text-decoration: underline;
  }

  /* FOOTER */
  footer {
    margin-top: 80px;
    padding-top: 24px;
    border-top: 2px solid var(--ink);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  footer strong {
    color: var(--ink);
  }

  .empty {
    text-align: center;
    padding: 80px 20px;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 18px;
  }

  @media (max-width: 600px) {
    .container { padding: 20px 20px 60px; }
    header { flex-direction: column; align-items: flex-start; }
    .stats { text-align: left; border-left: none; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 12px; }
    .grid { grid-template-columns: 1fr; }
    .section-desc { display: none; }
  }
</style>
</head>
<body>

<div class="container">

<header>
  <div class="masthead">
    <div class="meta-line">
      <span>Vol. 1</span>
      <span class="dot"></span>
      <span>Highland Park · 75205</span>
      <span class="dot"></span>
      <span>Curated for Roy</span>
    </div>
    <h1>Dallas, <span class="italic">examined.</span></h1>
    <p class="subtitle">A working guide to the city — bars, food, coffee, gyms, and everything in between. Built from research, refined by use.</p>
  </div>
  <div class="stats">
    Total Spots
    <strong id="total-count">28</strong>
  </div>
</header>

<nav class="nav" id="nav"></nav>

<main id="main"></main>

<footer>
  <div>
    <strong>Roy's Dallas Guide</strong> — Last updated April 24, 2026
  </div>
  <div>Click any card to open in Google Maps →</div>
</footer>

</div>

<script>
const SPOTS = [
  // NIGHTLIFE
  { cat: 'nightlife', name: "It'll Do Club", rating: 4.3, count: 721, price: 2, address: "4322 Elm St, Deep Ellum", note: "Cult-favorite Deep Ellum club. Sunday's 'The Church' is the legendary night. Music-first, no Vegas-bottle-service vibes. Uber it.", url: "https://maps.google.com/?cid=17668020170470540691", tags: ["Deep Ellum", "Sunday vibes"] },
  { cat: 'nightlife', name: "Green Light Social", rating: 3.8, count: 538, price: 2, address: "2625 Floyd St, Uptown", note: "3-in-1 venue: arcade bar, club, rooftop lounge. Free entry, mid-20s crowd. Best gateway club for going out in Uptown.", url: "https://maps.google.com/?cid=5295499699348469614", tags: ["Uptown", "Free entry"] },
  { cat: 'nightlife', name: "The Tipsy Alchemist", rating: 4.4, count: 968, price: 3, address: "2101 Cedar Springs Rd", note: "Lounge that turns into a club after 10pm. Solid craft cocktails, Uptown crowd. Reserve a spot if you want to actually sit.", url: "https://maps.google.com/?cid=11648288627562948124", tags: ["Cocktails", "Lounge"] },
  { cat: 'nightlife', name: "Rokwood", rating: 4.4, count: 212, price: 2, address: "600 Jackson St, Downtown", note: "Upscale ultraclub, Friday/Saturday only. Drink specials before midnight. Bring the energy if you go.", url: "https://maps.google.com/?cid=585048657305730896", tags: ["Weekends only", "Upscale"] },
  { cat: 'nightlife', name: "The Nines", rating: 4.0, count: 266, price: 2, address: "2911 Main St, Deep Ellum", note: "Deep Ellum hip-hop club. THC-infused cocktails (Texas legal). Big upstairs dance floor. For when you want a real club night.", url: "https://maps.google.com/?cid=2992976974625140130", tags: ["Hip-hop", "Late night"] },
  { cat: 'nightlife', name: "Taboo Lounge", rating: 4.2, count: 540, price: 2, address: "1418 N Riverfront Blvd", note: "Hookah + lounge + sports bar combo. $1 taco Tuesdays, $2 draft Friday happy hour. Cheap night out option.", url: "https://maps.google.com/?cid=17512532696725092819", tags: ["Hookah", "Cheap"] },

  // RESTAURANTS
  { cat: 'food', name: "Gemma", rating: 4.7, count: 792, price: 2, address: "2323 N Henderson Ave", note: "Henderson Ave bistro. The warm raisin scones at start are legendary. Reservations required. Best dinner in town.", url: "https://maps.google.com/?cid=16776959467984472921", tags: ["Henderson", "Reservations"] },
  { cat: 'food', name: "Quarter Acre", rating: 4.7, count: 236, price: 2, address: "2023 Greenville Ave", note: "7-course tasting menu, future Michelin energy. Reservations a must. For when you want to go all out.", url: "https://maps.google.com/?cid=18103532827925592262", tags: ["Tasting menu", "Splurge"] },
  { cat: 'food', name: "Knox Bistro", rating: 4.5, count: 907, price: 3, address: "3230 Knox St", note: "French bistro on Knox St. Walking distance from your place. Great brunch + dinner. Their foie gras is the play.", url: "https://maps.google.com/?cid=16504503270642416377", tags: ["French", "Walkable"] },
  { cat: 'food', name: "The Hampton Social", rating: 4.8, count: 3623, price: 2, address: "1520 Main St, Downtown", note: "Coastal vibes downtown. Solid brunch spot. Tuna tartare + steak & eggs are the moves. Instagrammy if she's into that.", url: "https://maps.google.com/?cid=9440724477373662356", tags: ["Brunch", "Date-friendly"] },
  { cat: 'food', name: "The Woolworth", rating: 4.8, count: 8540, price: 2, address: "1520 Elm St, Downtown", note: "4.8 stars over 8,500 reviews — that's rare. Solid cocktails + American food. Try the lobster mac.", url: "https://maps.google.com/?cid=13590217327680693997", tags: ["Cocktails", "American"] },
  { cat: 'food', name: "LOCAL Public Eatery", rating: 4.9, count: 2590, price: 2, address: "2323 N Henderson Ave", note: "Henderson Ave. 4.9 stars. Brunch pizza is the move. Open till 1-2am — late-night hangover food too.", url: "https://maps.google.com/?cid=11739867238180563734", tags: ["Late night", "Brunch"] },
  { cat: 'food', name: "Green Point", rating: 4.8, count: 391, price: 2, address: "3219 Knox St", note: "Knox St oyster bar (but solid even if you skip seafood). Crab artichoke dip + good cocktails. Walking distance.", url: "https://maps.google.com/?cid=2420725937368469287", tags: ["Knox St", "Cocktails"] },

  // COFFEE
  { cat: 'coffee', name: "Westside Coffee", rating: 4.9, count: 98, price: 2, address: "4711 Westside Dr", note: "Inside a converted church, super spacious. 7am opens. Free parking. Best for working remotely. Sundays closed.", url: "https://maps.google.com/?cid=13256191736448638353", tags: ["Work-friendly", "Spacious"] },
  { cat: 'coffee', name: "JuJu's Coffee", rating: 4.9, count: 208, price: 2, address: "6038 La Vista Dr", note: "Local hidden gem near Lakewood. Real coffee nerds, no syrup-bombs. Closed Tuesdays. East Dallas Blend is signature.", url: "https://maps.google.com/?cid=2967633645348088795", tags: ["Specialty", "Hidden gem"] },
  { cat: 'coffee', name: "Fairgrounds Coffee", rating: 4.4, count: 276, price: 2, address: "4514 Cole Ave", note: "Knox/Henderson, walking distance from you. Rope swings inside (yes, really). Tahini espresso is wild. Open till 6pm.", url: "https://maps.google.com/?cid=10770039913110635237", tags: ["Walkable", "Quirky"] },
  { cat: 'coffee', name: "Sip Stir Coffee", rating: 4.4, count: 676, price: 2, address: "3800 McKinney Ave, Uptown", note: "McKinney Ave Uptown. Spacious, quiet, made for laptop work. Try the Gulab Jamun latte (now permanent).", url: "https://maps.google.com/?cid=65428315905889904", tags: ["Uptown", "Work-friendly"] },
  { cat: 'coffee', name: "Wayward Coffee", rating: 4.5, count: 345, price: 2, address: "2025 E Irving Blvd", note: "Huge space, tons of seating, even meeting rooms. 7am-7pm every day. Best for serious work sessions.", url: "https://maps.google.com/?cid=1418955534934219838", tags: ["Late hours", "Big space"] },

  // DATE SPOTS
  { cat: 'date', name: "Dragonfly", rating: 4.4, count: 687, price: 3, address: "Hotel ZaZa, 2332 Leonard St", note: "In Hotel ZaZa. Intimate, fancy, low-key. Lamb + ribeye are killer. The crème brûlée is a 'order it' move. Reservations.", url: "https://maps.google.com/?cid=5625661118846807733", tags: ["Hotel ZaZa", "Reservations"] },
  { cat: 'date', name: "The Charles", rating: 4.7, count: 834, price: 2, address: "1632 Market Center Blvd", note: "Design District. Italian, romantic, requires reservations. Loud on weekends — book a weekday for actual conversation.", url: "https://maps.google.com/?cid=10780876512653040869", tags: ["Italian", "Design District"] },
  { cat: 'date', name: "Tango Room", rating: 4.6, count: 236, price: 4, address: "1617 Hi Line Dr", note: "Steakhouse, $$$$. Bone-in ribeye for two. For special-occasion dates only — anniversary, big milestones.", url: "https://maps.google.com/?cid=17437670959637534375", tags: ["Steakhouse", "Big splurge"] },
  { cat: 'date', name: "La Stella", rating: 4.8, count: 2554, price: 3, address: "2330 Flora St, Arts District", note: "Italian, downtown Arts District. Elegant but not stuffy. Sommelier on site. Butternut squash ravioli is the order.", url: "https://maps.google.com/?cid=16747910430417942352", tags: ["Italian", "Arts District"] },

  // GYM
  { cat: 'gym', name: "PARADIGM Gym 24hr", rating: 5.0, count: 24, price: 3, address: "4140 Lemmon Ave, Uptown", note: "24/7, Uptown. Rogue/Arsenal equipment. Sauna, kettlebells up to 123lbs. Best premium gym for serious lifting.", url: "https://maps.google.com/?cid=17027847555641276072", tags: ["24/7", "Premium"] },
  { cat: 'gym', name: "Trophy Fitness Uptown", rating: 4.8, count: 153, price: 2, address: "2812 Vine St, Uptown", note: "Multi-location membership, free towel service, sauna, cold plunge. Mid-priced. Friendly culture. Great for bro-split lifting.", url: "https://maps.google.com/?cid=3854049179849680706", tags: ["Sauna", "Mid-priced"] },

  // BARBER
  { cat: 'barber', name: "HQ Barbershop", rating: 5.0, count: 320, price: 2, address: "3527 Oak Lawn Ave", note: "Oak Lawn. 5.0 stars. Ask for Jordan or Anwar. Open till 9pm weekdays. 12 min drive from you.", url: "https://maps.google.com/?cid=18322674408249921677", tags: ["5.0 stars", "Late hours"] },
  { cat: 'barber', name: "Scissors & Scotch", rating: 4.9, count: 2046, price: 3, address: "100 Crescent Ct, Uptown", note: "Crescent Court, upscale. Membership model with free drinks. Pricey ($60+) but full experience. KC and Kryz are top.", url: "https://maps.google.com/?cid=1814899333348811818", tags: ["Upscale", "Membership"] },

  // GROCERY
  { cat: 'grocery', name: "Trader Joe's", rating: 4.7, count: 1382, price: 2, address: "4525 Cole Ave, Knox/Henderson", note: "Your go-to. Knox/Henderson, 5 min from you. Everything bagel seasoning, frozen kung pao chicken, sourdough — you know.", url: "https://maps.google.com/?cid=152645785608981447", tags: ["5 min away", "Go-to"] },
  { cat: 'grocery', name: "Central Market", rating: 4.6, count: 4207, price: 1, address: "5750 E Lovers Ln", note: "Massive, gourmet, prepared foods are insane. Better produce than TJ's, similar price. Their sandwiches > Jimmy John's.", url: "https://maps.google.com/?cid=12147552457782087627", tags: ["Gourmet", "Prepared foods"] },
];

const CATEGORIES = [
  { id: 'all', label: 'All', icon: '◆', desc: 'Everything', num: '00' },
  { id: 'food', label: 'Food', icon: '✦', desc: 'Restaurants & dinner', num: '01' },
  { id: 'coffee', label: 'Coffee', icon: '◐', desc: 'Working & casual hangs', num: '02' },
  { id: 'nightlife', label: 'Nightlife', icon: '✺', desc: 'Bars, clubs & late nights', num: '03' },
  { id: 'date', label: 'Date Spots', icon: '✥', desc: 'Romantic & special occasion', num: '04' },
  { id: 'gym', label: 'Gym', icon: '◇', desc: 'Lift & sweat', num: '05' },
  { id: 'barber', label: 'Barber', icon: '✂', desc: 'Cuts & grooming', num: '06' },
  { id: 'grocery', label: 'Grocery', icon: '◑', desc: 'Stocking the kitchen', num: '07' },
];

let activeCat = 'all';

// Render nav
function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = CATEGORIES.map(c => {
    const count = c.id === 'all' ? SPOTS.length : SPOTS.filter(s => s.cat === c.id).length;
    return `<button class="cat-btn ${activeCat === c.id ? 'active' : ''}" data-cat="${c.id}">
      ${c.icon} ${c.label} <span class="count">${count}</span>
    </button>`;
  }).join('');
  nav.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCat = btn.dataset.cat;
      renderNav();
      renderMain();
    });
  });
}

function priceTag(level) {
  return '$'.repeat(level);
}

function renderCard(spot) {
  return `<a href="${spot.url}" target="_blank" rel="noopener" class="card">
    <div class="card-header">
      <div class="card-name">${spot.name}</div>
      <div class="rating"><span class="num">${spot.rating}</span><br>${spot.count.toLocaleString()} reviews</div>
    </div>
    <div class="tags">
      <span class="tag price">${priceTag(spot.price)}</span>
      ${spot.tags.map(t => `<span class="tag">${t}</span>`).join('')}
    </div>
    <div class="note">${spot.note}</div>
    <div class="card-footer">
      <div class="address">${spot.address}</div>
      <div class="open-link">Maps</div>
    </div>
  </a>`;
}

function renderSection(cat) {
  const filtered = SPOTS.filter(s => s.cat === cat.id);
  if (filtered.length === 0) return '';
  return `<section class="section">
    <div class="section-header">
      <span class="section-num">№ ${cat.num}</span>
      <span class="section-title">${cat.label}</span>
      <span class="section-desc">${cat.desc} — ${filtered.length} spots</span>
    </div>
    <div class="grid">
      ${filtered.map(renderCard).join('')}
    </div>
  </section>`;
}

function renderMain() {
  const main = document.getElementById('main');
  const total = document.getElementById('total-count');

  if (activeCat === 'all') {
    total.textContent = SPOTS.length;
    main.innerHTML = CATEGORIES.filter(c => c.id !== 'all').map(renderSection).join('');
  } else {
    const cat = CATEGORIES.find(c => c.id === activeCat);
    const filtered = SPOTS.filter(s => s.cat === activeCat);
    total.textContent = filtered.length;
    if (filtered.length === 0) {
      main.innerHTML = `<div class="empty">No spots in this category yet.</div>`;
    } else {
      main.innerHTML = renderSection(cat);
    }
  }
}

renderNav();
renderMain();
</script>

</body>
</html>
