<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <radialGradient id="g1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#b8893a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#b8893a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#1f4a2e" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#1f4a2e" stop-opacity="0"/>
    </radialGradient>
    <style>
      .serif { font-family: 'Fraunces', Georgia, 'Times New Roman', serif; }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="1200" height="1200" fill="#f4f1ea"/>
  <rect width="1200" height="1200" fill="url(#g1)"/>
  <rect width="1200" height="1200" fill="url(#g2)"/>

  <line x1="100" y1="160" x2="1100" y2="160" stroke="#1a1814" stroke-width="3"/>

  <g class="mono" font-size="24" fill="#4a463e" letter-spacing="5">
    <text x="100" y="130">VOL. 01</text>
    <circle cx="245" cy="121" r="5" fill="#c8341e"/>
    <text x="270" y="130">THE CITIES</text>
  </g>

  <text x="100" y="500" class="serif" font-size="240" font-weight="900" fill="#1a1814" letter-spacing="-10">
    America,
  </text>
  <text x="100" y="730" class="serif" font-size="240" font-style="italic" font-weight="400" fill="#c8341e" letter-spacing="-10">
    examined.
  </text>

  <line x1="100" y1="850" x2="1100" y2="850" stroke="#d6cfbf" stroke-width="1"/>

  <text x="100" y="920" class="serif" font-size="40" font-style="italic" fill="#4a463e">
    A working guide to America,
  </text>
  <text x="100" y="975" class="serif" font-size="40" font-style="italic" fill="#4a463e">
    one city at a time.
  </text>

  <g class="mono" font-size="22" letter-spacing="4">
    <rect x="100" y="1050" width="200" height="50" fill="#c8341e"/>
    <text x="200" y="1083" fill="#f4f1ea" font-weight="700" text-anchor="middle">DALLAS · LIVE</text>

    <text x="340" y="1083" fill="#4a463e">+ 6 cities coming</text>
  </g>

  <text x="1100" y="1083" class="mono" font-size="22" font-weight="700" fill="#1a1814" letter-spacing="3" text-anchor="end">
    DALLAS-SCOUT.VERCEL.APP
  </text>
</svg>
